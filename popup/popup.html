<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suomen oikoluku</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      font-size: 14px;
      width: 260px;
      padding: 12px 16px;
      margin: 0;
      color: #202124;
    }
    h1 {
      font-size: 15px;
      font-weight: 600;
      margin: 0 0 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #34a853;
      flex-shrink: 0;
    }
    .status-dot.off {
      background: #9aa0a6;
    }
    label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .toggle {
      position: relative;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
    }
    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .toggle-slider {
      position: absolute;
      inset: 0;
      background: #9aa0a6;
      border-radius: 20px;
      transition: background 0.2s;
    }
    .toggle-slider::before {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      background: white;
      border-radius: 50%;
      top: 3px;
      left: 3px;
      transition: transform 0.2s;
    }
    .toggle input:checked + .toggle-slider {
      background: #1a73e8;
    }
    .toggle input:checked + .toggle-slider::before {
      transform: translateX(16px);
    }
    .site-name {
      font-size: 12px;
      color: #5f6368;
      margin: 4px 0 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    hr {
      border: none;
      border-top: 1px solid #e8eaed;
      margin: 12px 0;
    }
    .word-list-title {
      font-size: 12px;
      font-weight: 600;
      color: #5f6368;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    #word-list {
      max-height: 120px;
      overflow-y: auto;
      margin-bottom: 8px;
    }
    .word-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 0;
      font-size: 13px;
    }
    .remove-word {
      background: none;
      border: none;
      cursor: pointer;
      color: #9aa0a6;
      font-size: 16px;
      padding: 0 2px;
      line-height: 1;
    }
    .remove-word:hover {
      color: #d93025;
    }
    .empty-words {
      font-size: 12px;
      color: #9aa0a6;
      font-style: italic;
    }
    .version {
      font-size: 11px;
      color: #9aa0a6;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h1>
    <span class="status-dot" id="status-dot"></span>
    Suomen oikoluku
  </h1>

  <div class="site-name" id="site-name"></div>

  <label>
    <span class="toggle">
      <input type="checkbox" id="site-toggle" checked>
      <span class="toggle-slider"></span>
    </span>
    Oikoluku käytössä tällä sivulla
  </label>

  <hr>

  <div class="word-list-title">Oma sanalistta</div>
  <div id="word-list"></div>

  <div class="version">Voikko WASM · GPL-3.0</div>

  <script src="popup.js"></script>
</body>
</html>
