<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <title>Voikko-oikoluku — testi</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
    h1 { font-size: 18px; }
    textarea {
      width: 100%;
      height: 160px;
      font-size: 16px;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      resize: vertical;
    }
    input[type="text"] {
      width: 100%;
      font-size: 16px;
      padding: 8px 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-top: 16px;
    }
    label { display: block; margin-top: 20px; margin-bottom: 4px; font-weight: 600; font-size: 14px; }
    .hint { font-size: 12px; color: #888; margin-top: 6px; }
  </style>
</head>
<body>
  <h1>Voikko-oikoluku — testausivu</h1>

  <label for="ta">Tekstialue (textarea)</label>
  <textarea id="ta" spellcheck="false">Tässä on muutama väärin kirjotettu sana: koirra, talko, aurinko on kaunis.</textarea>
  <p class="hint">Väärin kirjoitettujen sanojen alla pitäisi näkyä punainen aaltoviiva. Klikkaa hiiren oikealla ehdotuksia varten.</p>

  <label for="inp">Tekstikenttä (input)</label>
  <input id="inp" type="text" spellcheck="false" value="Helsnki on Suomen pääkaupunki">
</body>
</html>
